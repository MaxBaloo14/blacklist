# Ping anti-pause : l'offre gratuite de Supabase met le projet en pause après ~7 jours sans activité.
# Toutes les 2 jours, on appelle le site, qui interroge réellement la base. Si le site ou la base ne répond pas, le job échoue et GitHub t'envoie un email.
name: Ping anti-pause
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger le site et la base
        run: |
          set -e
          out=$(curl -fsS --retry 4 --retry-delay 10 --max-time 40 https://blacklist-snowy.vercel.app/api/health)
          echo "$out"
          echo "$out" | grep -q '"ok":true'
