# Tests automatiques, dans un environnement ISOLÉ et jetable : aucune connexion à la vraie base, aucun secret.
# Une base PostgreSQL de test + un faux Supabase + le site compilé + un navigateur rejouent tout le parcours (inscription, défis,
# résultats, primes, pronostics, clips, notifications push, sécurité, accessibilité, téléphone, anglais).
# Lancé à chaque envoi de code, sur n'importe quelle branche. Pour tester AVANT de mettre en ligne : envoyer d'abord sur la branche « staging ».
name: Tests automatiques
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur de test
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Outils (PostgreSQL 16, ffmpeg, openssl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 ffmpeg openssl
          sudo pg_ctlcluster 16 main start || true
      - name: Tous les tests
        run: sudo -E env "PATH=$PATH" bash tests/run-all.sh
      - name: Captures d'écran des tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-tests
          path: /tmp/shots/e2e
          retention-days: 7
          if-no-files-found: ignore
